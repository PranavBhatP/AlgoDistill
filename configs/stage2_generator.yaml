# Stage 2: Tag-Conditioned Generator & Baseline Configuration
model:
  base_model: "Qwen/Qwen2.5-Coder-0.5B"  # Scalable to 1.5B
  max_seq_length: 1024
  quantization: "4bit"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  learning_rate: 1.5e-4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 4
  weight_decay: 0.01
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_steps: 50
  save_total_limit: 2

data_sweep:
  fractions: [0.10, 0.25, 0.50, 1.00]
  seed: 42

generation:
  temperature: 0.2
  top_p: 0.95
  max_new_tokens: 512
  do_sample: true
  num_return_sequences: 1
