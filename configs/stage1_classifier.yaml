# Stage 1: Algorithmic Tag Classifier Configuration
model:
  base_model: "Qwen/Qwen2.5-Coder-0.5B"
  num_labels: 10
  max_seq_length: 512
  quantization: "4bit"  # 4-bit NormalFloat (NF4)
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "SEQ_CLS"

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  num_train_epochs: 5
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  logging_steps: 10
  eval_steps: 50
  save_total_limit: 2
  early_stopping_patience: 3

taxonomy:
  tags:
    - "dynamic programming"
    - "greedy"
    - "graphs"
    - "math"
    - "data structures"
    - "trees"
    - "brute force"
    - "strings"
    - "number theory"
    - "binary search"
